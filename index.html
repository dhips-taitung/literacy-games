<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>國字小遊戲</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@700;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-grid: #fce4ec;
      --card-bg: #ffffff;
      --main-blue: #7ba4cf;
      --border-blue: #b0c4de;
      --tab-card: #b8a7ea;
      --tab-trace: #eeb375;
      --tab-choice: #88ab9a;
      --tab-write: #a1b8cc;
      --btn-gray: #e2e8f0;
      --btn-blue: #6aa1d8;
      --btn-green: #38b2ac;
      --btn-red: #e53935;
      --btn-orange: #ed8936;
      --zy-color: #c53030;
    }

    * { box-sizing: border-box; }

    body {
      font-family: "DFKai-SB", "標楷體", sans-serif;
      background-color: #f7fafc;
      background-image: 
        linear-gradient(var(--bg-grid) 1.5px, transparent 1.5px),
        linear-gradient(90deg, var(--bg-grid) 1.5px, transparent 1.5px);
      background-size: 24px 24px;
      margin: 0; padding: 10px;
      min-height: 100vh;
      display: flex; justify-content: center; align-items: center;
      user-select: none; touch-action: manipulation;
    }

    .main-wrapper {
      width: 100%; max-width: 980px;
      background: rgba(255, 255, 255, 0.98);
      border: 4px solid var(--border-blue);
      border-radius: 28px; padding: 15px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.06);
      position: relative;
    }

    .top-header {
      border: 3px solid var(--border-blue);
      border-radius: 18px; padding: 8px 15px;
      display: flex; justify-content: space-between; align-items: center;
      background-color: #fff; margin-bottom: 12px;
    }

    .app-title { font-family: 'Zen Maru Gothic', cursive, sans-serif; font-size: 1.8rem; color: #637b9d; margin: 0; }
    .user-info-badge { font-size: 1.1rem; font-weight: bold; color: #2b6cb0; background: #ebf8ff; padding: 4px 12px; border-radius: 12px; border: 1px solid #bee3f8; }

    .header-icons { display: flex; gap: 14px; align-items: center; }
    .icon-svg-btn {
      width: 36px; height: 36px; cursor: pointer; color: #7b8eab;
      display: flex; align-items: center; justify-content: center; transition: transform 0.15s;
    }
    .icon-svg-btn:hover { transform: scale(1.1); }
    .icon-svg-btn svg { width: 30px; height: 30px; fill: currentColor; }

    .content-area { display: flex; gap: 12px; position: relative; }
    .game-card-container {
      flex: 1; border: 3px solid var(--border-blue); border-radius: 20px; padding: 15px;
      min-height: 460px; display: flex; flex-direction: column; align-items: center; justify-content: space-between; background-color: #fff;
      position: relative;
    }

    .side-tabs { display: flex; flex-direction: column; gap: 8px; justify-content: flex-end; align-items: flex-end; }
    
    .finish-submit-btn {
      width: 65px; padding: 8px 4px; border-radius: 16px; border: none;
      background: linear-gradient(135deg, #48bb78, #38b2ac); color: white;
      font-family: "DFKai-SB", "標楷體", sans-serif; font-size: 0.95rem; font-weight: bold;
      text-align: center; cursor: pointer; box-shadow: 0 4px 10px rgba(56,178,172,0.3);
      margin-bottom: 6px; line-height: 1.2;
    }
    .finish-submit-btn:hover { transform: scale(1.05); }

    .tab-btn {
      width: 55px; height: 80px; border-radius: 25px 0 0 25px; border: none; color: white;
      font-family: "DFKai-SB", "標楷體", sans-serif; font-size: 1.2rem; font-weight: bold;
      writing-mode: vertical-rl; display: flex; align-items: center; justify-content: center; cursor: pointer; opacity: 0.85;
    }
    .tab-btn.active { width: 65px; opacity: 1; box-shadow: -4px 0 10px rgba(0,0,0,0.1); }
    .tab-btn.disabled { display: none !important; }
    .tab-card { background-color: var(--tab-card); }
    .tab-trace { background-color: var(--tab-trace); }
    .tab-choice { background-color: var(--tab-choice); }
    .tab-write { background-color: var(--tab-write); }

    .btn-kai {
      font-family: "DFKai-SB", "標楷體", sans-serif; font-size: 1rem; padding: 6px 14px;
      border-radius: 10px; border: none; cursor: pointer; box-shadow: 0 3px 6px rgba(0,0,0,0.08);
      display: inline-flex; align-items: center; justify-content: center; gap: 4px;
    }
    .btn-kai.sm { font-size: 0.85rem; padding: 4px 8px; border-radius: 6px; }
    .btn-gray { background-color: var(--btn-gray); color: #334e68; }
    .btn-blue { background-color: var(--btn-blue); color: white; }
    .btn-green { background-color: var(--btn-green); color: white; }
    .btn-orange { background-color: var(--btn-orange); color: white; }
    .btn-red { background-color: var(--btn-red); color: white; }

    .mode-panel { width: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; flex: 1; }

    /* 注音直式排版元件 */
    .ruby-box {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      vertical-align: middle;
      margin: 0 4px;
    }
    .ruby-han {
      line-height: 1;
      font-family: "DFKai-SB", "標楷體", sans-serif;
    }
    .ruby-zy-col {
      display: inline-flex;
      position: relative;
      margin-left: 2px;
      line-height: 1;
      align-items: center;
    }
    .ruby-zy-symbols {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: "DFKai-SB", "標楷體", sans-serif;
      color: var(--zy-color);
      line-height: 1.05;
      font-size: 0.46em;
    }
    .ruby-zy-tone {
      position: absolute;
      color: var(--zy-color);
      font-size: 0.42em;
      line-height: 1;
      font-family: "DFKai-SB", "標楷體", sans-serif;
    }
    .tone-top { top: -0.35em; left: 50%; transform: translateX(-50%); }
    .tone-side { right: -0.55em; bottom: 0.05em; }

    /* 字卡 3D 翻轉卡片效果 */
    .flashcard-container {
      width: 220px; height: 220px; perspective: 1000px; cursor: pointer; margin-bottom: 10px;
    }
    .flashcard {
      width: 100%; height: 100%; position: relative; transform-style: preserve-3d;
      transition: transform 0.6s; border: 3px solid var(--border-blue); border-radius: 20px;
      background: #ffffff; box-shadow: 0 6px 16px rgba(0,0,0,0.08);
    }
    .flashcard.flipped { transform: rotateY(180deg); }
    .card-face {
      position: absolute; width: 100%; height: 100%; backface-visibility: hidden;
      display: flex; align-items: center; justify-content: center; font-weight: bold; border-radius: 18px;
    }
    .card-front { font-size: 5rem; color: #2c3e50; }
    .card-back { font-size: 3.5rem; color: #2b6cb0; transform: rotateY(180deg); background: #f0f8ff; }

    .canvas-frame {
      width: 280px; height: 280px; max-width: 60vw; max-height: 60vw;
      border: 3px solid var(--border-blue); border-radius: 20px;
      background-color: #ffffff; position: relative; margin: 0 auto; touch-action: none;
    }
    canvas { width: 100%; height: 100%; border-radius: 18px; touch-action: none; cursor: crosshair; }

    .control-bar { display: flex; gap: 8px; align-items: center; margin-top: 10px; flex-wrap: wrap; justify-content: center; }
    .nav-question-bar { display: flex; gap: 6px; align-items: center; justify-content: center; margin-top: 10px; padding-top: 8px; border-top: 2px dashed #e2e8f0; width: 100%; flex-wrap: wrap; }
    .q-btn { width: 34px; height: 34px; border-radius: 50%; border: 2px solid #cbd5e0; background: #edf2f7; font-weight: bold; cursor: pointer; display: flex; align-items: center; justify-content: center; }
    .q-btn.active { border-color: var(--main-blue); transform: scale(1.1); font-weight: 900; }
    .q-btn.answered { background-color: #48bb78; color: white; border-color: #38a169; }

    .modal-mask { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.5); display: none; align-items: center; justify-content: center; z-index: 100; }
    .modal-content { background: #fff; padding: 20px; border-radius: 20px; width: 94%; max-width: 900px; max-height: 92vh; display: flex; flex-direction: column; border: 3px solid var(--border-blue); }
    .modal-content.sm { max-width: 380px; text-align: center; }

    .admin-nav { display: flex; gap: 8px; border-bottom: 2px solid #e2e8f0; padding-bottom: 8px; margin-bottom: 12px; flex-wrap: wrap; }
    .admin-tab-btn { padding: 6px 12px; border-radius: 8px; border: none; background: #edf2f7; cursor: pointer; font-weight: bold; font-family: "DFKai-SB", "標楷體", sans-serif; }
    .admin-tab-btn.active { background: var(--btn-blue); color: white; }
    .admin-body { flex: 1; overflow-y: auto; padding-right: 4px; }

    .admin-table { width: 100%; border-collapse: collapse; margin-bottom: 12px; }
    .admin-table th, .admin-table td { border: 1px solid #e2e8f0; padding: 8px; text-align: center; }
    .admin-table th { background: #f7fafc; }

    .editor-card-box {
      border: 1.5px solid #dce4ec; border-radius: 16px; padding: 14px; margin-bottom: 14px; background: #ffffff;
      box-shadow: 0 2px 8px rgba(0,0,0,0.04);
    }
    .unit-tag {
      display: inline-flex; align-items: center; gap: 4px; background: #f0f4f8;
      border: 1px solid #cbd5e0; border-radius: 8px; padding: 4px 8px; margin: 3px;
    }
    .unit-tag input {
      border: 1px solid #cbd5e0; border-radius: 6px; padding: 3px 6px; font-family: "DFKai-SB", "標楷體", sans-serif;
    }

    .locked-overlay {
      position: absolute; top:0; left:0; width:100%; height:100%;
      background: rgba(255,255,255,0.95); border-radius: 20px;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      z-index: 50; padding: 20px;
    }

    .question-display-banner {
      display: flex; align-items: center; justify-content: center; flex-wrap: wrap; gap: 6px;
      font-size: 2.2rem; min-height: 70px; margin-bottom: 15px;
    }

    .blank-slot {
      display: inline-flex; flex-direction: column; align-items: center; justify-content: center;
      min-width: 60px; height: 60px; border: 2px dashed #4a5568; border-radius: 12px;
      background: #edf2f7; padding: 4px 10px; margin: 0 4px;
    }

    /* 成果檢視卡片樣式 */
    .sub-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 12px;
    }
    .sub-card {
      border: 2px solid #e2e8f0;
      border-radius: 12px;
      padding: 10px;
      background: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      box-shadow: 0 2px 6px rgba(0,0,0,0.04);
    }
    .sub-thumb {
      width: 110px;
      height: 110px;
      border: 1px solid #cbd5e0;
      border-radius: 8px;
      background: #fff;
      cursor: pointer;
      object-fit: contain;
      transition: transform 0.15s;
    }
    .sub-thumb:hover {
      transform: scale(1.05);
      box-shadow: 0 4px 10px rgba(0,0,0,0.15);
    }

    @media (max-width: 600px) {
      .app-title { font-size: 1.3rem; }
      .tab-btn { width: 45px; height: 70px; font-size: 1rem; }
      .tab-btn.active { width: 52px; }
      .finish-submit-btn { width: 52px; font-size: 0.8rem; }
      .canvas-frame { width: 220px; height: 220px; }
      .flashcard-container { width: 170px; height: 170px; }
      .question-display-banner { font-size: 1.6rem; }
    }
  </style>
</head>
<body>

  <div class="main-wrapper">
    <div class="top-header">
      <h1 class="app-title">國字小遊戲</h1>
      <div class="user-info-badge" id="studentBadge">未登入</div>
      <div class="header-icons">
        <div class="icon-svg-btn" onclick="openModal('loginModal')" title="學生登入">
          <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 3c1.66 0 3 1.34 3 3s-1.34 3-3 3-3-1.34-3-3 1.34-3 3-3zm0 14.2c-2.5 0-4.71-1.28-6-3.22.03-1.99 4-3.08 6-3.08 1.99 0 5.97 1.09 6 3.08-1.29 1.94-3.5 3.22-6 3.22z"/></svg>
        </div>
        <div class="icon-svg-btn" onclick="openModal('teacherAuthModal')" title="教職員/管理員登入">
          <svg viewBox="0 0 24 24"><path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.5c-1.93 0-3.5-1.57-3.5-3.5s1.57-3.5 3.5-3.5 3.5 1.57 3.5 3.5-1.57 3.5-3.5 3.5z"/></svg>
        </div>
      </div>
    </div>

    <div class="content-area">
      <div class="game-card-container">
        <!-- 未派發任務或鎖定遮罩 -->
        <div class="locked-overlay" id="lockedOverlay" style="display:none;">
          <h1 style="font-size:2.4rem; color:#e53935; margin-bottom:10px;" id="lockOverlayTitle">📢 教師尚未發派任務</h1>
          <p style="font-size:1.2rem; color:#4a5568; text-align:center;" id="lockOverlayMsg">請等待老師派發題目或開啟權限後再進行作答。</p>
        </div>

        <!-- 模式 1：字卡 (含直式注音) -->
        <div id="mode1" class="mode-panel" style="display:none;">
          <div class="flashcard-container" onclick="toggleCardFlip()">
            <div class="flashcard" id="mainFlashcard">
              <div class="card-face card-front" id="m1Front"></div>
              <div class="card-face card-back" id="m1Back"></div>
            </div>
          </div>
          <p style="color:#718096; font-size:0.95rem; margin:0;">💡 點擊卡片可翻看國字與注音</p>
        </div>

        <!-- 模式 2：習寫 -->
        <div id="mode2" class="mode-panel" style="display:none;">
          <div style="font-size:1.4rem; font-weight:bold; margin-bottom:8px; display:flex; align-items:center;" id="m2Title"></div>
          <div class="canvas-frame">
            <canvas id="traceCanvas"></canvas>
          </div>
          <div class="control-bar">
            <button class="btn-kai btn-gray sm" onclick="clearCanvas('traceCanvas')">清除重寫</button>
            <button class="btn-kai btn-blue sm" onclick="markAnswered()">完成此題</button>
          </div>
        </div>

        <!-- 模式 3：選字 (支援多字前後綴直式注音) -->
        <div id="mode3" class="mode-panel" style="display:none;">
          <div class="question-display-banner" id="m3Title"></div>
          <div id="m3Options" class="control-bar"></div>
        </div>

        <!-- 模式 4：寫詞 -->
        <div id="mode4" class="mode-panel" style="display:none;">
          <div class="question-display-banner" id="m4Title"></div>
          <div class="canvas-frame">
            <canvas id="writeCanvas"></canvas>
          </div>
          <div class="control-bar">
            <button class="btn-kai btn-gray sm" onclick="clearCanvas('writeCanvas')">清除重寫</button>
            <button class="btn-kai btn-blue sm" onclick="markAnswered()">完成此題</button>
            <button class="btn-kai btn-orange sm" id="m4HintBtn" style="display:none;" onclick="showWriteHint()">💡 提示</button>
          </div>
        </div>

        <!-- 導覽控制區 -->
        <div style="width: 100%;">
          <div class="control-bar">
            <button class="btn-kai btn-gray" id="btnPrev" onclick="prevQ()">上一題</button>
            <button class="btn-kai btn-blue" id="btnNext" onclick="nextQ()">下一題</button>
          </div>
          <div class="nav-question-bar" id="qNavContainer"></div>
        </div>
      </div>

      <!-- 側邊標籤頁籤 -->
      <div class="side-tabs">
        <button class="finish-submit-btn" onclick="checkAndSubmitAll()">全部作答完畢</button>
        <button class="tab-btn tab-card active" id="tab1" onclick="switchMode(1)">字卡</button>
        <button class="tab-btn tab-trace" id="tab2" onclick="switchMode(2)">習寫</button>
        <button class="tab-btn tab-choice" id="tab3" onclick="switchMode(3)">選字</button>
        <button class="tab-btn tab-write" id="tab4" onclick="switchMode(4)">寫詞</button>
      </div>
    </div>
  </div>

  <!-- 學生登入 Modal -->
  <div class="modal-mask" id="loginModal">
    <div class="modal-content sm">
      <h3>🎒 學生登入</h3>
      <input type="password" id="loginStudentPwd" style="width:100%; font-size:1.1rem; padding:8px; margin-bottom:15px; text-align:center;" placeholder="請輸入學生密碼" onkeydown="if(event.key==='Enter') handleStudentLogin()">
      <div style="display:flex; gap:10px; justify-content:center;">
        <button class="btn-kai btn-gray" onclick="closeModal('loginModal')">取消</button>
        <button class="btn-kai btn-blue" onclick="handleStudentLogin()">登入</button>
      </div>
    </div>
  </div>

  <!-- 教職員登入 Modal -->
  <div class="modal-mask" id="teacherAuthModal">
    <div class="modal-content sm">
      <h3>🔒 教職員/管理員登入</h3>
      <input type="text" id="teacherIdInput" style="width:100%; font-size:1.1rem; padding:6px; margin-bottom:8px;" placeholder="帳號 ID" onkeydown="if(event.key==='Enter') document.getElementById('teacherPwdInput').focus()">
      <input type="password" id="teacherPwdInput" style="width:100%; font-size:1.1rem; padding:6px; margin-bottom:12px;" placeholder="密碼" onkeydown="if(event.key==='Enter') handleTeacherAuth()">
      <div style="display:flex; gap:10px; justify-content:center;">
        <button class="btn-kai btn-gray" onclick="closeModal('teacherAuthModal')">取消</button>
        <button class="btn-kai btn-green" onclick="handleTeacherAuth()">登入</button>
      </div>
    </div>
  </div>

  <!-- 筆跡大圖檢視 Modal -->
  <div class="modal-mask" id="previewModal" style="z-index: 150;">
    <div class="modal-content sm" style="max-width: 420px; align-items:center;">
      <h3 id="previewTitle" style="margin:0 0 10px 0;">🔍 筆跡原檔檢視</h3>
      <div style="width:280px; height:280px; border:2px solid var(--border-blue); border-radius:16px; background:#fff; display:flex; align-items:center; justify-content:center; margin-bottom:12px;">
        <img id="previewImage" src="" style="width:100%; height:100%; object-fit:contain; border-radius:14px;">
      </div>
      <button class="btn-kai btn-blue" onclick="closeModal('previewModal')">關閉預覽</button>
    </div>
  </div>

  <!-- 後台控制台與圖形化題庫編輯器 -->
  <div class="modal-mask" id="adminModal">
    <div class="modal-content">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
        <h2 style="margin:0;" id="backendTitle">🛠️ 圖形化題庫編輯器</h2>
        <div style="display:flex; gap:6px;">
          <button class="btn-kai btn-blue sm" onclick="loadBackendData()" title="重新整理後台資料">🔄 重新整理</button>
          <button class="btn-kai btn-gray sm" onclick="closeModal('adminModal')">✕ 關閉</button>
        </div>
      </div>
      <div class="admin-nav">
        <button class="admin-tab-btn active" onclick="switchAdminTab(1)">題庫編輯器</button>
        <button class="admin-tab-btn" onclick="switchAdminTab(2)" id="studentTabNav">學生名單與權限</button>
        <button class="admin-tab-btn" onclick="switchAdminTab(3)" id="teacherTabNav" style="display:none;">老師帳號設定</button>
        <button class="admin-tab-btn" onclick="switchAdminTab(4)">發布題目</button>
        <button class="admin-tab-btn" onclick="switchAdminTab(5)" style="background:#fed7d7; color:#9b2c2c;">📝 學生作業與筆跡檢視</button>
      </div>
      <div class="admin-body">
        
        <!-- 頁籤 1：圖形化題庫編輯器 -->
        <div id="adminTab1">
          <div style="background:#edf2f7; padding:8px 12px; border-radius:12px; margin-bottom:10px; display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:8px;">
            <div style="display:flex; align-items:center; gap:6px;">
              <b>目前編輯題庫：</b>
              <select id="bankSelector" onchange="changeEditingBank(this.value)" style="padding:4px 8px; font-size:0.95rem; border-radius:6px; font-family:'DFKai-SB', sans-serif;"></select>
              <button class="btn-kai btn-blue sm" onclick="createNewBankPrompt()">+ 新增題庫</button>
              <button class="btn-kai btn-red sm" onclick="deleteCurrentBank()">刪除題庫</button>
            </div>
            <div style="display:flex; gap:6px; align-items:center;">

  <script>
    const GAS_API_URL = "https://script.google.com/macros/s/AKfycbyHU8-XjwlEw_Kg1y55hKm_ybMop9-nVS3n9q1OcDPoaonfG8n1EfmUZB_w_2ZQv0VFrA/exec";

    const DEFAULT_TASK_DATA = {
      chars: [
        { char: "陽", zhuyin: "ㄧㄤˊ" },
        { char: "山", zhuyin: "ㄕㄢ" },
        { char: "高", zhuyin: "ㄍㄠ" }
      ],
      choice: [
        {
          prefixUnits: [{ char: "高", zhuyin: "ㄍㄠ" }],
          suffixUnits: [],
          zhuyin: "ㄕㄢ",
          options: ["山", "出"],
          answer: "山"
        },
        {
          prefixUnits: [{ char: "太", zhuyin: "ㄊㄞˋ" }],
          suffixUnits: [],
          zhuyin: "ㄧㄤˊ",
          options: ["陽", "楊"],
          answer: "陽"
        }
      ],
      write: [
        {
          prefixUnits: [{ char: "高", zhuyin: "ㄍㄠ" }],
          suffixUnits: [],
          answerChar: "山",
          answerZhuyin: "ㄕㄢ",
          allowHint: true
        }
      ]
    };

    let DB = JSON.parse(JSON.stringify(DEFAULT_TASK_DATA));
    let currentStudent = null;
    let currentUser = null;
    let currentBankName = "預設題庫";
    let currentMode = 1, currentQIdx = 0;
    let activeModes = ['card', 'trace', 'choice', 'write'];
    let answeredState = { 1: {}, 2: {}, 3: {}, 4: {} };
    let drawingsState = { 2: {}, 4: {} };
    let adminData = { banks: [], students: [], teachers: [], assigns: [], submissions: [] };
    let isDrawing = false;
    let currentSubTab = 2;

    function openModal(id) { document.getElementById(id).style.display = 'flex'; }
    function closeModal(id) { document.getElementById(id).style.display = 'none'; }

    function jsonpFetch(url, params, callback) {
      const callbackName = 'jsonp_cb_' + Math.round(100000 * Math.random());
      window[callbackName] = function(data) {
        delete window[callbackName];
        if (script.parentNode) script.parentNode.removeChild(script);
        callback(data);
      };
      const queryParams = new URLSearchParams(params);
      queryParams.append('callback', callbackName);
      const script = document.createElement('script');
      script.src = url + '?' + queryParams.toString();
      document.body.appendChild(script);
    }

    function postAPI(body, callback) {
      fetch(GAS_API_URL, {
        method: 'POST',
        headers: {
          'Content-Type': 'text/plain;charset=utf-8'
        },
        body: JSON.stringify(body)
      })
      .then(res => res.json())
      .then(res => {
        if (callback) callback(res);
      })
      .catch(err => {
        console.error("POST API 失敗:", err);
        if (callback) callback({ status: 'error', message: err.toString() });
      });
    }

    /* 直式注音解析與渲染 */
    function parseZhuyin(zyStr) {
      if (!zyStr) return { symbols: [], tone: '', toneType: 'none' };
      let tone = '';
      let toneType = 'none';
      let clean = String(zyStr).trim();

      if (clean.includes('˙')) {
        tone = '˙'; toneType = 'top'; clean = clean.replace(/˙/g, '');
      } else if (clean.includes('ˊ')) {
        tone = 'ˊ'; toneType = 'side'; clean = clean.replace(/ˊ/g, '');
      } else if (clean.includes('ˇ')) {
        tone = 'ˇ'; toneType = 'side'; clean = clean.replace(/ˇ/g, '');
      } else if (clean.includes('ˋ')) {
        tone = 'ˋ'; toneType = 'side'; clean = clean.replace(/ˋ/g, '');
      }

      const symbols = clean.split('');
      return { symbols, tone, toneType };
    }

    function renderRubyHTML(char, zhuyin, fontSize = '2.4rem', charColor = '#2c3e50') {
      const p = parseZhuyin(zhuyin);
      const symHtml = p.symbols.map(s => `<span>${s}</span>`).join('');
      let toneHtml = '';
      if (p.tone) {
        toneHtml = `<span class="ruby-zy-tone ${p.toneType === 'top' ? 'tone-top' : 'tone-side'}">${p.tone}</span>`;
      }

      return `
        <span class="ruby-box" style="font-size:${fontSize};">
          <span class="ruby-han" style="color:${charColor};">${char || ''}</span>
          <span class="ruby-zy-col">
            <span class="ruby-zy-symbols">${symHtml}</span>
            ${toneHtml}
          </span>
        </span>
      `;
    }

    function renderPureZhuyinHTML(zhuyin, fontSize = '1.8rem') {
      const p = parseZhuyin(zhuyin);
      const symHtml = p.symbols.map(s => `<span>${s}</span>`).join('');
      let toneHtml = '';
      if (p.tone) {
        toneHtml = `<span class="ruby-zy-tone ${p.toneType === 'top' ? 'tone-top' : 'tone-side'}">${p.tone}</span>`;
      }
      return `
        <span class="ruby-zy-col" style="font-size:${fontSize}; display:inline-flex;">
          <span class="ruby-zy-symbols">${symHtml}</span>
          ${toneHtml}
        </span>
      `;
    }

    function renderUnitListHTML(units, fontSize = '2.2rem') {
      if (!units || units.length === 0) return '';
      return units.map(u => renderRubyHTML(u.char, u.zhuyin, fontSize)).join('');
    }

    /* 學生端登入與作答 */
    function handleStudentLogin() {
      const pwd = document.getElementById('loginStudentPwd').value.trim();
      if (!pwd) return alert("請輸入密碼！");

      jsonpFetch(GAS_API_URL, { action: 'studentLogin', password: pwd }, function(res) {
        if (res.status === 'success') {
          currentStudent = res.student;
          currentBankName = res.bankName || "派發題庫";
          document.getElementById('studentBadge').innerText = `${currentStudent.className} - ${currentStudent.name}`;
          if (res.taskData && Object.keys(res.taskData).length > 0) DB = res.taskData;
          if (res.assignModes) activeModes = res.assignModes;
          
          closeModal('loginModal');
          document.getElementById('lockedOverlay').style.display = 'none';
          updateTabVisibility();
          const firstMode = getNextActiveMode(0);
          if (firstMode) switchMode(firstMode);
        } else if (res.status === 'no_task') {
          currentStudent = res.student;
          document.getElementById('studentBadge').innerText = `${currentStudent.className} - ${currentStudent.name}`;
          closeModal('loginModal');
          document.getElementById('lockedOverlay').style.display = 'flex';
        } else {
          alert(res.message || "密碼錯誤！");
        }
      });
    }

    function updateTabVisibility() {
      const modeMap = { 1: 'card', 2: 'trace', 3: 'choice', 4: 'write' };
      for (let i = 1; i <= 4; i++) {
        const tabEl = document.getElementById(`tab${i}`);
        if (activeModes.includes(modeMap[i])) {
          tabEl.classList.remove('disabled');
        } else {
          tabEl.classList.add('disabled');
        }
      }
    }

    function getNextActiveMode(startMode) {
      const modeMap = { 1: 'card', 2: 'trace', 3: 'choice', 4: 'write' };
      for (let i = startMode + 1; i <= 4; i++) {
        if (activeModes.includes(modeMap[i])) return i;
      }
      return null;
    }

    function switchMode(m) {
      autoSaveCurrentCanvas();
      currentMode = m; currentQIdx = 0;
      document.querySelectorAll('.tab-btn').forEach((b, i) => b.classList.toggle('active', i === m - 1));
      renderQ();
    }

    function toggleCardFlip() {
      document.getElementById('mainFlashcard').classList.toggle('flipped');
    }

    function renderQ() {
      const card = document.getElementById('mainFlashcard');
      if (card) card.classList.remove('flipped');

      const list = currentMode <= 2 ? DB.chars : (currentMode === 3 ? DB.choice : DB.write);
      document.querySelectorAll('.mode-panel').forEach((p, i) => p.style.display = i === currentMode - 1 ? 'flex' : 'none');

      if (!list || list.length === 0) return;

      if (currentMode === 1) {
        const item = list[currentQIdx] || {};
        document.getElementById('m1Front').innerHTML = renderRubyHTML(item.char || '', '', '5rem');
        document.getElementById('m1Back').innerHTML = renderRubyHTML(item.char || '', item.zhuyin || '', '4.2rem', '#2b6cb0');
      } else if (currentMode === 2) {
        const item = list[currentQIdx] || {};
        document.getElementById('m2Title').innerHTML = `請寫出國字： ${renderRubyHTML(item.char || '', item.zhuyin || '', '2.5rem')}`;
        initCanvas('traceCanvas');
      } else if (currentMode === 3) {
        const item = list[currentQIdx];
        const prefixHTML = renderUnitListHTML(item.prefixUnits || []);
        const suffixHTML = renderUnitListHTML(item.suffixUnits || []);
        const blankHTML = `<span class="blank-slot">${renderPureZhuyinHTML(item.zhuyin || '', '2.2rem')}</span>`;
        document.getElementById('m3Title').innerHTML = `${prefixHTML} ${blankHTML} ${suffixHTML}`;

        const optContainer = document.getElementById('m3Options');
        optContainer.innerHTML = '';
        (item.options || []).forEach(opt => {
          optContainer.innerHTML += `<button class="btn-kai btn-blue" style="font-size:1.5rem; padding:10px 24px;" onclick="selectChoice('${opt}')">${opt}</button>`;
        });
      } else if (currentMode === 4) {
        const item = list[currentQIdx];
        const prefixHTML = renderUnitListHTML(item.prefixUnits || []);
        const suffixHTML = renderUnitListHTML(item.suffixUnits || []);
        const blankHTML = `<span class="blank-slot">${renderPureZhuyinHTML(item.answerZhuyin || '', '2.2rem')}</span>`;
        document.getElementById('m4Title').innerHTML = `${prefixHTML} ${blankHTML} ${suffixHTML}`;
        document.getElementById('m4HintBtn').style.display = item.allowHint ? 'inline-block' : 'none';
        initCanvas('writeCanvas');
      }

      renderNavButtons(list.length);
    }

    function selectChoice(opt) {
      const item = DB.choice[currentQIdx];
      if (opt === item.answer) {
        alert("答對了！🎉");
        markAnswered();
      } else { alert("再試一次看看喔！"); }
    }

    function showWriteHint() {
      const item = DB.write[currentQIdx];
      alert(`💡 提示答案：國字【${item.answerChar}】 注音【${item.answerZhuyin}】`);
    }

    /* 自動即時儲存畫布筆跡 */
    function autoSaveCurrentCanvas() {
      if (currentMode === 2) {
        const canvas = document.getElementById('traceCanvas');
        if (canvas) {
          const item = DB.chars[currentQIdx];
          drawingsState[2][currentQIdx] = {
            base64: canvas.toDataURL('image/png'),
            targetChar: item ? item.char : '',
            modeName: '習寫',
            qIndex: currentQIdx
          };
        }
      } else if (currentMode === 4) {
        const canvas = document.getElementById('writeCanvas');
        if (canvas) {
          const item = DB.write[currentQIdx];
          drawingsState[4][currentQIdx] = {
            base64: canvas.toDataURL('image/png'),
            targetChar: item ? item.answerChar : '',
            modeName: '寫詞',
            qIndex: currentQIdx
          };
        }
      }
    }

    function markAnswered() {
      autoSaveCurrentCanvas();
      answeredState[currentMode][currentQIdx] = true;
      renderQ();
    }

    function renderNavButtons(total) {
      const container = document.getElementById('qNavContainer');
      container.innerHTML = '';
      for (let i = 0; i < total; i++) {
        const isAns = answeredState[currentMode][i];
        const isActive = i === currentQIdx;
        container.innerHTML += `<button class="q-btn ${isActive ? 'active' : ''} ${isAns ? 'answered' : ''}" onclick="jumpToQ(${i})">${i + 1}</button>`;
      }
    }

    function jumpToQ(idx) {
      autoSaveCurrentCanvas();
      currentQIdx = idx;
      renderQ();
    }
    function prevQ() {
      if (currentQIdx > 0) {
        autoSaveCurrentCanvas();
        currentQIdx--;
        renderQ();
      }
    }
    function nextQ() {
      const list = currentMode <= 2 ? DB.chars : (currentMode === 3 ? DB.choice : DB.write);
      if (currentQIdx < list.length - 1) {
        autoSaveCurrentCanvas();
        currentQIdx++;
        renderQ();
      }
    }

    /* 全部作答完畢檢查與送出 */
    function checkAndSubmitAll() {
      if (!currentStudent) return alert("請先登入！");

      autoSaveCurrentCanvas();

      let hasUnfinished = false;
      activeModes.forEach(mIdx => {
        const modeNum = mIdx === 'card' ? 1 : (mIdx === 'trace' ? 2 : (mIdx === 'choice' ? 3 : 4));
        const list = modeNum <= 2 ? DB.chars : (modeNum === 3 ? DB.choice : DB.write);
        for (let i = 0; i < (list ? list.length : 0); i++) {
          if (!answeredState[modeNum][i]) {
            hasUnfinished = true; break;
          }
        }
      });

      if (hasUnfinished) {
        if (!confirm("尚有題目未完成，確定要繳交嗎？")) return;
      }

      // 彙整所有手寫圖檔
      const allDrawings = [];
      [2, 4].forEach(m => {
        Object.keys(drawingsState[m]).forEach(qIdx => {
          if (drawingsState[m][qIdx]) {
            allDrawings.push(drawingsState[m][qIdx]);
          }
        });
      });

      document.getElementById('lockOverlayTitle').innerText = "⏳ 作業上傳中...";
      document.getElementById('lockOverlayTitle').style.color = "#3182ce";
      document.getElementById('lockOverlayMsg').innerText = "正在儲存您的手寫筆跡圖檔至試算表，請稍候...";
      document.getElementById('lockedOverlay').style.display = 'flex';

      postAPI({
        action: 'submitDrawingsAndLock',
        studentId: currentStudent.id,
        studentName: currentStudent.name,
        className: currentStudent.className,
        bankName: currentBankName,
        drawings: allDrawings
      }, (res) => {
        document.getElementById('lockOverlayTitle').innerText = "🎉 你真棒！";
        document.getElementById('lockOverlayTitle').style.color = "#38b2ac";
        document.getElementById('lockOverlayMsg').innerText = "作業已全部完成，手寫練習圖檔已成功寫入教師試算表！";
      });
    }

    /* 手寫板 Canvas 繪圖功能 */
    function initCanvas(canvasId) {
      setTimeout(() => {
        const canvas = document.getElementById(canvasId);
        if (!canvas) return;
        const rect = canvas.getBoundingClientRect();
        canvas.width = rect.width;
        canvas.height = rect.height;

        const ctx = canvas.getContext('2d');
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.strokeStyle = '#2c3e50';
        ctx.lineWidth = 5;
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';

        // 若該題已有歷史畫布圖檔，自動載入還原
        const savedDrawing = drawingsState[currentMode] && drawingsState[currentMode][currentQIdx];
        if (savedDrawing && savedDrawing.base64) {
          const img = new Image();
          img.onload = function() {
            ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
          };
          img.src = savedDrawing.base64;
        }

        function getPos(e) {
          const cRect = canvas.getBoundingClientRect();
          const clientX = e.touches ? e.touches[0].clientX : e.clientX;
          const clientY = e.touches ? e.touches[0].clientY : e.clientY;
          return { x: clientX - cRect.left, y: clientY - cRect.top };
        }

        canvas.onmousedown = canvas.ontouchstart = function(e) {
          isDrawing = true;
          const pos = getPos(e);
          ctx.beginPath();
          ctx.moveTo(pos.x, pos.y);
        };
        canvas.onmousemove = canvas.ontouchmove = function(e) {
          if (!isDrawing) return;
          const pos = getPos(e);
          ctx.lineTo(pos.x, pos.y);
          ctx.stroke();
        };
        canvas.onmouseup = canvas.ontouchend = function() {
          if (isDrawing) {
            isDrawing = false;
            autoSaveCurrentCanvas();
          }
        };
      }, 50);
    }

    function clearCanvas(canvasId) {
      const canvas = document.getElementById(canvasId);
      if (canvas) {
        const ctx = canvas.getContext('2d');
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        if (drawingsState[currentMode]) {
          delete drawingsState[currentMode][currentQIdx];
        }
      }
    }

    function renderBankSelector() {
      const bSel = document.getElementById('bankSelector');

        banks.push({ name: "預設題庫", taskData: DB });
        adminData.banks = banks;
      }
      bSel.innerHTML = banks.map(b => `<option value="${b.name}">${b.name}</option>`).join('');

    function changeEditingBank(bankName) {
      const bank = (adminData.banks || []).find(b => b.name === bankName);
      if (bank && bank.taskData) {
        DB = typeof bank.taskData === 'string' ? JSON.parse(bank.taskData) : bank.taskData;
        normalizeDBData();
        document.getElementById('editingBankName').value = bank.name;
        renderEditorTables();
      }
    }

    function normalizeDBData() {
      DB.chars = DB.chars || [];
      DB.choice = DB.choice || [];
      DB.write = DB.write || [];
      DB.choice.forEach(ch => {
        if (!ch.prefixUnits && ch.prefix) ch.prefixUnits = [{ char: ch.prefix, zhuyin: "" }];
        if (!ch.suffixUnits && ch.suffix) ch.suffixUnits = [{ char: ch.suffix, zhuyin: "" }];
        ch.prefixUnits = ch.prefixUnits || [];
        ch.suffixUnits = ch.suffixUnits || [];
      });
      DB.write.forEach(w => {
        if (!w.prefixUnits && w.prefix) w.prefixUnits = [{ char: w.prefix, zhuyin: "" }];
        if (!w.suffixUnits && w.suffix) w.suffixUnits = [{ char: w.suffix, zhuyin: "" }];
        w.prefixUnits = w.prefixUnits || [];
        w.suffixUnits = w.suffixUnits || [];
      });
    }

      const name = prompt("請輸入新題庫名稱：");
      if (!name) return;
      DB = JSON.parse(JSON.stringify(DEFAULT_TASK_DATA));
      adminData.banks = adminData.banks || [];
      adminData.banks.push({ name: name, taskData: DB });

    function importBankJSON(event) {
      const file = event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(e) {
        try {
          const imported = JSON.parse(e.target.result);
          DB = imported;
          normalizeDBData();
          renderEditorTables();
          alert("匯入成功！請點擊『儲存題庫』將題目同步儲存至雲端。");
        } catch (err) {
          alert("JSON 檔案格式錯誤，請確認檔案內容！");
        }
      };
      reader.readAsText(file);
      event.target.value = '';
    }

    function updateChoiceAnswerDropdown(cIdx) {
      const ch = DB.choice[cIdx];
      const sel = document.getElementById(`choiceAnsSel_${cIdx}`);
      if (sel) {
        sel.innerHTML = (ch.options || []).map(opt => `<option value="${opt}" ${opt === ch.answer ? 'selected' : ''}>${opt}</option>`).join('');

          ch.answer = ch.options[0];
          sel.value = ch.answer;

    function submitBatchAssign() {
      const bankName = document.getElementById('assignBankSelect').value;
      const selectedStudentIds = Array.from(document.querySelectorAll('.stu-assign-chk:checked')).map(chk => chk.value);

      if (selectedStudentIds.length === 0) return alert("請至少勾選一位學生！");

      const modes = [];
      if (document.getElementById('chkCard').checked) modes.push('card');
      if (document.getElementById('chkTrace').checked) modes.push('trace');
      if (document.getElementById('chkChoice').checked) modes.push('choice');
      if (document.getElementById('chkWrite').checked) modes.push('write');

      const onlyAssignKeepLock = document.getElementById('chkOnlyAssignKeepLock').checked;

      postAPI({
        action: 'assignBatch',
        bankName: bankName,
        studentIds: selectedStudentIds,
        modes: modes,
        unlockStudents: !onlyAssignKeepLock
      }, () => {
        alert(onlyAssignKeepLock ? "題目發布成功！已保留學生鎖定狀態。" : "題目發布成功！已自動解除選取學生之鎖定。");
        loadBackendData();
      });
    }

    /* 需求 2：後台檢視學生作業與筆跡原檔檢視 */
    function initSubmissionFilters() {
      const subs = adminData.submissions || [];
      const classSet = new Set(), stuSet = new Set(), bankSet = new Set();
      subs.forEach(s => {
        if (s.className) classSet.add(s.className);
        if (s.studentName) stuSet.add(s.studentName);
        if (s.bankName) bankSet.add(s.bankName);
      });

      const cSel = document.getElementById('subFilterClass');
      cSel.innerHTML = '<option value="ALL">全部班級</option>' + Array.from(classSet).map(c => `<option value="${c}">${c}</option>`).join('');

      const sSel = document.getElementById('subFilterStudent');
      sSel.innerHTML = '<option value="ALL">全部學生</option>' + Array.from(stuSet).map(s => `<option value="${s}">${s}</option>`).join('');

      const bSel = document.getElementById('subFilterBank');
      bSel.innerHTML = '<option value="ALL">全部題庫</option>' + Array.from(bankSet).map(b => `<option value="${b}">${b}</option>`).join('');
    }

    function renderSubmissions() {
      const container = document.getElementById('submissionsContainer');
      const fClass = document.getElementById('subFilterClass').value;
      const fStu = document.getElementById('subFilterStudent').value;
      const fBank = document.getElementById('subFilterBank').value;

      let list = adminData.submissions || [];
      if (fClass !== 'ALL') list = list.filter(s => s.className === fClass);
      if (fStu !== 'ALL') list = list.filter(s => s.studentName === fStu);
      if (fBank !== 'ALL') list = list.filter(s => s.bankName === fBank);

      if (list.length === 0) {
        container.innerHTML = '<div style="grid-column:1/-1; text-align:center; color:#718096; padding:30px; font-size:1.1rem;">目前尚無符合條件的學生作答紀錄。</div>';
        return;
      }

      container.innerHTML = list.map((item, idx) => {
        const hasImg = item.base64 && item.base64.indexOf('data:image') !== -1;
        return `
          <div class="sub-card">
            <div style="font-weight:bold; color:#2b6cb0; font-size:1rem; margin-bottom:4px;">${item.className} - ${item.studentName}</div>
            <div style="font-size:0.85rem; color:#718096; margin-bottom:6px;">第 ${item.qIndex} 題：【${item.targetChar}】 (${item.modeName})</div>
            ${hasImg ? 
              `<img src="${item.base64}" class="sub-thumb" onclick="previewDrawing('${item.studentName} - ${item.targetChar}', '${item.base64}')" title="點擊放大檢視原圖">` : 
              `<div style="width:110px; height:110px; background:#edf2f7; border-radius:8px; display:flex; align-items:center; justify-content:center; color:#a0aec0; font-size:0.85rem;">無手寫圖檔</div>`
            }
            <div style="font-size:0.75rem; color:#a0aec0; margin-top:6px;">${item.time}</div>
          </div>
        `;
      }).join('');
    }

    function previewDrawing(title, base64) {
      document.getElementById('previewTitle').innerText = `🔍 筆跡檢視：${title}`;
      document.getElementById('previewImage').src = base64;
      openModal('previewModal');
    }

    function saveStudent() {
      const className = document.getElementById('stuClass').value;
      const studentId = document.getElementById('stuId').value;
      const name = document.getElementById('stuName').value;
      const pwd = document.getElementById('stuPwd').value;
      postAPI({ action: 'saveStudent', className, studentId, name, pwd }, loadBackendData);
    }

    function saveTeacher() {
      const teacherId = document.getElementById('tId').value;
      const name = document.getElementById('tName').value;
      const pwd = document.getElementById('tPwd').value;
      const managedClass = document.getElementById('tClass').value;
      postAPI({ action: 'saveTeacher', teacherId, name, pwd, managedClass }, loadBackendData);
    }

    switchMode(1);
  </script>
</body>
</html>
